# THAM KHẢO — server đã có nginx chạy sẵn ngoài Docker, file này KHÔNG
# chạy trong container nào cả. Dán 2 block dưới vào config nginx system
# của bạn (VD /etc/nginx/sites-available/twistfit.org), rồi `nginx -t` +
# reload. Nhớ đổi domain đúng thật, và thêm cert TLS (certbot/letsencrypt)
# trước khi lên production thật — bản này vẫn chỉ HTTP.
#
# 127.0.0.1:34002 / 34000 là port container publish ra host (xem
# docker-compose.yml) — nginx system và container nằm cùng máy nên gọi
# thẳng qua localhost, không qua tên service Docker được nữa.

server {
    listen 80;
    server_name twistfit.org www.twistfit.org;

    # Mọi request (kể cả /api/*) đi vào Next.js — Next tự proxy /api/*
    # sang backend nội bộ (xem ghi chú trong docker-compose.yml).
    location / {
        proxy_pass http://127.0.0.1:34002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name storage.twistfit.org;

    # Browser PUT thẳng vào đây bằng presigned URL do backend sinh ra.
    # Presigned URL ký cả Host header (SigV4) nên MINIO_PUBLIC_ENDPOINT
    # trong .env (root) phải khớp đúng domain này.
    location / {
        proxy_pass http://127.0.0.1:34000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ảnh upload có thể vài MB — nới giới hạn body mặc định của nginx.
        client_max_body_size 20m;
    }
}

# Console quản trị MinIO (port 34001) cố tình KHÔNG có block ở đây — nếu
# muốn truy cập qua domain, tự thêm server block riêng trỏ 127.0.0.1:34001
# và cân nhắc giới hạn thêm (VD allow theo IP) vì console chỉ cần đúng
# root user/pass là vào được, không có lớp chặn nào khác.
