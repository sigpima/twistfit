# DRAFT — chỉ HTTP, chưa có TLS. Thay twistfit.org / storage.twistfit.org
# bằng domain thật, và thêm cert (certbot/letsencrypt) trước khi lên
# production thật.

server {
    listen 80;
    server_name twistfit.org www.twistfit.org;

    # Mọi request (kể cả /api/*) đi vào Next.js — Next tự proxy /api/*
    # sang backend nội bộ (xem ghi chú trong docker-compose.yml).
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name storage.twistfit.org;

    # Browser PUT thẳng vào đây bằng presigned URL do backend sinh ra.
    # Presigned URL ký cả Host header (SigV4) nên MINIO_PUBLIC_URL trong
    # docker-compose.yml phải khớp đúng domain này.
    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ảnh upload có thể vài MB — nới giới hạn body mặc định của nginx.
        client_max_body_size 20m;
    }
}
