name: Build MinIO image (self-built, community edition dropped Docker images)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/minio-image/**"
  schedule:
    # Weekly, so the image picks up MinIO/mc source updates. Remove this
    # trigger if you'd rather only rebuild manually.
    - cron: "0 3 * * 1"

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/minio-image
          push: true
          tags: |
            ghcr.io/sigpima/minio:latest
            ghcr.io/sigpima/minio:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
