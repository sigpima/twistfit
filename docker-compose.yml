# DRAFT — để hình dung kiến trúc deploy, chưa phải bản production cuối cùng.
#
# Nguyên tắc network: chỉ "reverse-proxy" publish port ra host (80/443).
# frontend/backend/db/minio đều KHÔNG publish port — chỉ gọi nhau qua tên
# service trong network nội bộ "app_net". Đây là cách "backend private,
# không public" mà không cần internal:true (backend vẫn cần internet ra
# ngoài để gọi Gemini/Flux/catvton-service trên Vast.ai).
#
# Next proxy (browser -> Next -> backend, xem frontend/next.config.ts +
# frontend/lib/apiClient.ts) và MinIO migration (backend/app/core/blob_storage.py)
# đã code xong — phần còn lại là TLS/Let's Encrypt cho reverse-proxy
# (nginx.conf draft chỉ có HTTP).

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - minio
    ports:
      - "80:80"
      # - "443:443"   # bật khi có cert TLS
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - app_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Không cần build-arg NEXT_PUBLIC_API_BASE_URL nữa — apiClient.ts mặc
      # định dùng path tương đối "/api" cho browser (xem .env.example).
    env_file:
      - ./frontend/.env
    environment:
      # Runtime (không phải build-arg) — đọc bởi next.config.ts rewrites()
      # và bởi apiClient.ts khi chạy SSR. Không có prefix NEXT_PUBLIC_ nên
      # không lộ ra browser bundle.
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - app_net
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Trỏ về MinIO thay vì Azurite. MINIO_PUBLIC_ENDPOINT phải khớp đúng
      # domain mà nginx expose ở dưới (server_name storage.twistfit.vn) vì
      # SigV4 ký cả Host header — xem generate_upload_sas_url trong
      # backend/app/core/blob_storage.py.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://storage.twistfit.org
      # Dùng root credentials cho draft này. Lên production thật nên tạo
      # service account/policy riêng cho từng bucket (mc admin user/policy)
      # thay vì để backend cầm quyền root của MinIO.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - db
      - minio
    networks:
      - app_net
    restart: unless-stopped

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: twistfit
      POSTGRES_PASSWORD: twistfit
      POSTGRES_DB: twistfit_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - app_net
    restart: unless-stopped
    # Port 9000 (S3 API) chỉ lộ ra ngoài qua reverse-proxy ở domain
    # storage.twistfit.vn (browser PUT thẳng vào đây bằng presigned URL).
    # Port 9001 (console quản trị) KHÔNG expose qua reverse-proxy — muốn
    # vào console thì SSH tunnel: ssh -L 9001:localhost:9001 <server>

networks:
  app_net:

volumes:
  postgres_data:
  minio_data:
