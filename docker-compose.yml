# DRAFT — để hình dung kiến trúc deploy, chưa phải bản production cuối cùng.
#
# Server đã có sẵn nginx chạy ngoài Docker — file này KHÔNG tự chạy reverse
# proxy nữa, chỉ publish port thẳng ra host cho nginx system trỏ vào (xem
# deploy/nginx.conf — giờ là file tham khảo để dán vào nginx system, không
# phải config chạy trong container nữa):
#   - frontend -> host 34002
#   - minio (S3 API) -> host 34000
#   - minio (console quản trị) -> host 34001
#
# 2 network:
#   - "public_net": frontend + minio — 2 service cần publish port ra host.
#   - "private_net": backend + db + frontend + minio — network nội bộ để
#     4 service gọi nhau qua tên service (backend/db KHÔNG publish port,
#     không nằm trên public_net — đây là cách "backend private").
# Cả 2 network hiện đều là bridge thường (không internal:true) — nếu muốn
# khoá private_net không cho ra Internet luôn thì backend sẽ mất internet
# (đang cần gọi Gemini/Flux/catvton-service trên Vast.ai), phải tính riêng.
#
# image "ghcr.io/sigpima/minio": MinIO community edition không còn cho pull
# image free trên Docker Hub nữa (source-only từ giờ) — image này do chính
# mình build từ source qua .github/workflows/build-minio.yml, chứa cả 2
# binary "minio" (server) và "mc" (client, dùng ở minio-init-policy).
#
# Backup cho postgres_data/minio_data vẫn chưa làm — làm ở bước sau.

services:

  frontend:
    # GitHub Actions (twistfit-fe repo) build + push image này lên GHCR mỗi
    # lần push — server chỉ pull, không tự build. Không cần build-arg
    # NEXT_PUBLIC_API_BASE_URL — apiClient.ts mặc định dùng path tương đối
    # "/api" cho browser (xem .env.example).
    # FRONTEND_IMAGE_TAG cho phép ghim/rollback về 1 bản build cụ thể (VD
    # 1 git SHA CI đã push) thay vì luôn lấy :latest — xem .env.example.
    image: ghcr.io/sigpima/twistfit-fe:${FRONTEND_IMAGE_TAG:-latest}
    env_file:
      - ./frontend/.env
    environment:
      # Chỉ có tác dụng với apiClient.ts lúc chạy SSR (đọc runtime thật).
      # KHÔNG có tác dụng với next.config.ts rewrites() — verify thật thì
      # với output "standalone", rewrites() chỉ chạy 1 lần lúc `next build`,
      # giá trị bị đóng băng vào image từ lúc đó, đổi biến này ở đây không
      # còn ảnh hưởng gì nữa (frontend/next.config.ts đã hardcode đúng
      # "http://backend:8000" khớp tên service ở compose này rồi). Vẫn giữ
      # biến này vì apiClient.ts cần nó thật.
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:34002:3000"
    networks:
      - public_net
      - private_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # GitHub Actions (twistfit-be repo) build + push image này lên GHCR mỗi
    # lần push — server chỉ pull, không tự build. BACKEND_IMAGE_TAG: xem
    # ghi chú FRONTEND_IMAGE_TAG ở trên, cùng cơ chế.
    image: ghcr.io/sigpima/twistfit-be:${BACKEND_IMAGE_TAG:-latest}
    env_file:
      - ./backend/.env
    environment:
      # Trỏ về MinIO thay vì Azurite. MINIO_PUBLIC_ENDPOINT phải khớp đúng
      # domain mà nginx expose ở dưới (server_name storage.twistfit.org) vì
      # SigV4 ký cả Host header — xem generate_upload_sas_url trong
      # backend/app/core/blob_storage.py.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?thiếu MINIO_PUBLIC_ENDPOINT trong .env}
      # Dùng user riêng (scope theo từng bucket, tạo bởi minio-init-policy),
      # không còn dùng quyền root của MinIO nữa.
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?thiếu MINIO_APP_ACCESS_KEY trong .env}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?thiếu MINIO_APP_SECRET_KEY trong .env}
    depends_on:
      db:
        condition: service_healthy
      minio-init-buckets:
        condition: service_completed_successfully
      minio-init-policy:
        condition: service_completed_successfully
    networks:
      # private_net là internal:true (không route ra Internet) — backend
      # cần join thêm public_net để có DNS/internet gọi Gemini/Flux/
      # catvton-service. Không publish port nào ở đây nên vẫn không bị lộ
      # ra ngoài — join network khác "publish port ra host".
      - private_net
      - public_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?thiếu POSTGRES_DB trong .env}
    volumes:
      # postgres:18+ đổi convention: mount ở /var/lib/postgresql (không phải
      # .../data như bản 16) — image tự tạo subfolder theo major version bên
      # trong. Mount nhầm chỗ cũ sẽ crash-loop ngay lúc khởi động.
      - postgres_data:/var/lib/postgresql
    networks:
      - private_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # Xem ghi chú "ghcr.io/sigpima/minio" ở đầu file — image tự build, không
    # còn dùng minio/minio (Docker Hub) được nữa.
    image: ghcr.io/sigpima/minio:${MINIO_IMAGE_TAG:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?thiếu MINIO_ROOT_USER trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?thiếu MINIO_ROOT_PASSWORD trong .env}
      # MinIO không có CORS theo từng bucket (không implement PutBucketCors
      # chuẩn S3 — đã verify thật, cả boto3 và `mc cors set` đều báo
      # NotImplemented) — CORS được set ở cấp server thế này. Mặc định của
      # biến này là "*" (cho phép mọi origin) nếu không set; ghi rõ ra đây
      # để giới hạn đúng domain thật, thay vì để mặc định wildcard.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-https://twistfit.org}
    ports:
      # 9000 = S3 API (browser PUT thẳng vào bằng presigned URL, qua nginx
      # system ở domain storage.twistfit.org). 9001 = console quản trị —
      # publish thẳng theo yêu cầu, nhưng nên tự giới hạn thêm ở nginx
      # system/firewall (IP allowlist) vì console chỉ cần login đúng root
      # user/pass là vào được, không có gì chặn thêm ở tầng network nữa.
      - "127.0.0.1:34000:9000"
      - "127.0.0.1:34001:9001"
      - "${PRIVATE_SUBNET}:34001:9001"
    volumes:
      - minio_data:/data
    networks:
      - public_net
      - private_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Job một lần (restart: "no"), tạo sẵn 5 bucket + set public-read policy
  # bằng đúng code app đang dùng (ensure_container trong
  # backend/app/core/blob_storage.py) — chạy bằng quyền root MinIO, xong thì
  # backend chỉ cần quyền hạn chế (xem minio-init-policy). CORS không nằm ở
  # đây — xem MINIO_API_CORS_ALLOW_ORIGIN ở service "minio" trên.
  minio-init-buckets:
    image: ghcr.io/sigpima/twistfit-be:${BACKEND_IMAGE_TAG:-latest}
    entrypoint: ["python3", "-c"]
    command:
      - |
        from app.core.blob_storage import ensure_container
        for c in ["wardrobe", "accessories", "blog", "forum", "results"]:
            ensure_container(c)
            print(f"ensured bucket: {c}")
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?thiếu MINIO_PUBLIC_ENDPOINT trong .env}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?thiếu MINIO_ROOT_USER trong .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?thiếu MINIO_ROOT_PASSWORD trong .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - private_net
    restart: "no"

  # Job một lần, tạo user riêng (MINIO_APP_ACCESS_KEY) chỉ có quyền
  # đọc/ghi/list đúng 5 bucket ở trên (deploy/minio-app-policy.json) —
  # không có quyền root. `|| true` ở dòng "user add" để chạy lại
  # (docker compose up) không lỗi nếu user đã tồn tại từ lần trước.
  minio-init-policy:
    image: ghcr.io/sigpima/minio:${MINIO_IMAGE_TAG:-latest}
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        (mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" || true) &&
        mc admin policy create local twistfit-app /policies/twistfit-app-policy.json &&
        mc admin policy attach local twistfit-app --user "$$MINIO_APP_ACCESS_KEY"
    volumes:
      - ./deploy/minio-app-policy.json:/policies/twistfit-app-policy.json:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?thiếu MINIO_ROOT_USER trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?thiếu MINIO_ROOT_PASSWORD trong .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?thiếu MINIO_APP_ACCESS_KEY trong .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?thiếu MINIO_APP_SECRET_KEY trong .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - private_net
    restart: "no"

networks:
  # MTU 1492 (không phải mặc định 1500 của Docker) — đo thật bằng
  # `ping -M do -s 1472 <host>` từ trong container, gateway trả về
  # "Frag needed and DF set (mtu = 1492)". Lệch 8 byte này khiến gói tin
  # lớn (TLS handshake đầy đủ, request có body ảnh...) bị rớt âm thầm dọc
  # đường — gây treo tới timeout khi gọi Gemini/Flux dù ping thường/DNS
  # vẫn bình thường. Đổi lại nếu hạ tầng mạng thật thay đổi.
  public_net:
    driver_opts:
      com.docker.network.driver.mtu: "1492"
  private_net:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1492"

volumes:
  postgres_data:
  minio_data:
